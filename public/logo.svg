<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 150 150" width="150" height="150">
  <defs>
    <linearGradient id="rb-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366F1"/>
      <stop offset="55%" stop-color="#7C6FE8"/>
      <stop offset="100%" stop-color="#8B5CF6"/>
    </linearGradient>
    <radialGradient id="rb-glow" cx="32%" cy="30%" r="72%">
      <stop offset="0%" stop-color="#818CF8" stop-opacity="1"/>
      <stop offset="45%" stop-color="#6366F1" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#6366F1" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="rb-bg-aura" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#1E1B4B" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#0A0A12" stop-opacity="0"/>
    </radialGradient>
    <filter id="rb-blur-soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>
    <filter id="rb-blur-hard" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4"/>
    </filter>
  </defs>

  <rect x="0" y="0" width="150" height="150" rx="28" ry="28" fill="#0A0A12"/>
  <rect x="0" y="0" width="150" height="150" rx="28" ry="28" fill="url(#rb-bg-aura)"/>

  <rect x="22" y="22" width="106" height="106" rx="24" ry="24" fill="url(#rb-glow)" filter="url(#rb-blur-soft)" opacity="0.85"/>

  <rect x="28" y="28" width="94" height="94" rx="22" ry="22" fill="url(#rb-grad)"/>
  <rect x="28" y="28" width="94" height="94" rx="22" ry="22" fill="none" stroke="#ffffff" stroke-opacity="0.18" stroke-width="1"/>

  <ellipse cx="55" cy="48" rx="28" ry="12" fill="#ffffff" opacity="0.12" filter="url(#rb-blur-hard)"/>

  <text x="75" y="92"
        font-family="'DM Serif Display', 'Playfair Display', Georgia, 'Times New Roman', serif"
        font-size="46"
        font-weight="400"
        fill="#ffffff"
        text-anchor="middle"
        letter-spacing="-1.5">RB</text>
</svg>
